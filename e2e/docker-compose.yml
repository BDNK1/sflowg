services:
  wiremock:
    image: wiremock/wiremock:3.9.1
    ports:
      - "8089:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
    command:
      - "--global-response-templating"
      - "--verbose"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sflowg
      POSTGRES_PASSWORD: sflowg
      POSTGRES_DB: sflowg_e2e
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sflowg -d sflowg_e2e"]
      interval: 2s
      timeout: 2s
      retries: 30

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:29092
    ports:
      - "29092:19092"
      - "19644:9644"
